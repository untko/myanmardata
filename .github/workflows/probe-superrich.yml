# Temporary: run the SuperRich collector live from a GitHub-hosted runner.
name: Probe SuperRich

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/probe-superrich.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      - name: Collect live
        run: |
          uv run myanmardata sources
          uv run myanmardata collect superrich_th superrich_1965 --out out
          for f in out/*/snapshots/*/*.csv; do
            echo "== $f ($(($(wc -l < "$f") - 1)) rows)"
            grep -E ',(USD|MMK|CNY),' "$f" | cut -d, -f1-12
          done
          # superrich_1965 publishes update times, so an immediate rerun should be skipped.
          uv run myanmardata collect superrich_1965 --out out
