# Temporary: run the SuperRich collector live from a GitHub-hosted runner.
name: Probe SuperRich

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/probe-superrich.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      - name: Collect live
        run: |
          uv run myanmardata collect superrich_th --out out
          f=$(ls out/superrich_th/snapshots/*/*.csv)
          wc -l "$f"
          grep -E ',(USD|MMK|CNY),' "$f"
          uv run myanmardata collect superrich_th --out out

      - name: Look for timestamps in the page payload
        run: |
          curl -sS -m 30 -A 'Mozilla/5.0' https://www.superrichthailand.com/exchange-rate \
            | grep -oiE '.{0,80}(updat|lastUpdate|dateTime|asOf|effective)[^,]{0,80}' | head -20 || true

      - name: Probe SuperRich 1965 JSON
        run: |
          for q in 'method=1' 'method=3&value=33'; do
            echo "== $q"
            curl -sS -m 30 -A 'Mozilla/5.0' "https://www.superrich.co.th/controllers/currency.php?$q" | head -c 3000; echo
          done
