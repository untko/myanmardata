# Temporary: inspect SuperRich endpoints from a GitHub-hosted runner.
name: Probe SuperRich

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/probe-superrich.yml"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36'
          probe() {
            echo "::group::$*"
            curl -sS -m 30 -L -A "$UA" -o body -w 'HTTP %{http_code} %{content_type} %{size_download}B %{url_effective}\n' "$@" || true
            head -c 4000 body; echo
            echo "::endgroup::"
          }
          probe https://www.superrichthailand.com/
          probe https://www.superrichthailand.com/exchange-rate
          probe https://www.superrichthailand.com/web/api/v1/rates
          probe -H 'Authorization: Basic c3VwZXJyaWNoVGg6aFRoY2lycmVwdVM=' https://www.superrichthailand.com/web/api/v1/rates
          probe -H 'Authorization: Basic c3VwZXJyaWNoVGg6aFRoY2lycmVwdVM=' https://www.superrichthailand.com/web/api/v1/currencies
          probe https://superrichthailand.com/assets/resource/locale-en.json
          probe https://www.superrich1965.com/
          probe https://www.superrich.co.th/currency_rate.php
          # Find API hosts referenced by the front-end bundles.
          curl -sS -m 30 -L -A "$UA" https://www.superrichthailand.com/exchange-rate -o page.html || true
          grep -oE '(src|href)="[^"]+\.js[^"]*"' page.html | head -20 || true
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' page.html | sed -E 's/src="([^"]+)"/\1/' | head -10); do
            case "$js" in http*) u="$js" ;; /*) u="https://www.superrichthailand.com$js" ;; *) u="https://www.superrichthailand.com/$js" ;; esac
            echo "== $u"
            curl -sS -m 30 -A "$UA" "$u" | grep -oE '"[^"]*(api|Basic |Authorization)[^"]{0,120}"' | sort -u | head -30 || true
          done
